<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWaste - Municipal Waste Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .gov-header {
            background: #1a237e;
            color: #fff;
            padding: 24px 0 16px 0;
            text-align: center;
            border-bottom: 4px solid #3949ab;
        }
        .gov-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1a237e, #3949ab, #43a047, #66bb6a);
            position: relative;
        }
        .gradient-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
        }
        .square-button {
            width: 120px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin: 0 10px;
        }
        .square-button.login {
            background: linear-gradient(135deg, #3949ab, #1a237e);
            color: white;
        }
        .square-button.login:hover {
            background: #1a237e;
        }
        .title-glow {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }
        .gov-box {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(60, 72, 88, 0.08);
            padding: 32px 28px 24px 28px;
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col">
    <div class="gov-header">
        <img src="waste.png" alt="Gov Logo" class="gov-logo">
        <div style="font-size:1.2rem;font-weight:600;">Municipal Waste Management System</div>
        <div style="font-size:1rem;font-weight:400;opacity:0.8;">Government Portal</div>
    </div>
    <div class="flex flex-1 items-center justify-center">
        <div class="gov-box w-full">
            <h1 class="text-3xl font-bold text-[#1a237e] mb-2 text-center title-glow">EcoWaste</h1>
            <p class="text-lg text-[#3949ab] mb-6 text-center">Government Login - Municipal Waste Management</p>
            <form id="loginForm">
                <div class="mb-4">
                    <label for="email" class="block text-[#3949ab] font-medium mb-1">Official Email</label>
                    <input type="email" id="email" placeholder="Enter your official email" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#3949ab] text-gray-800" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-[#3949ab] font-medium mb-1">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#3949ab] text-gray-800" required>
                </div>
                <button type="submit" class="square-button login w-full mb-2 text-lg rounded-xl">Login</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-[#3949ab]">Don't have an account?
                    <a href="CreatAccount.html" class="text-[#1a237e] font-semibold hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </div>
    <script>
        // Redirect to homepage on login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // You can add authentication logic here
            window.location.href = "homepage.html";
        });
    </script>
</body>
</html>
